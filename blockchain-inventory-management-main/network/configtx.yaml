Organizations:
  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: crypto-config/ordererOrganizations/inventory.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"

  - &InventoryOrg
    Name: InventoryOrg
    ID: InventoryOrgMSP
    MSPDir: crypto-config/peerOrganizations/inventory.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('InventoryOrgMSP.admin', 'InventoryOrgMSP.peer', 'InventoryOrgMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('InventoryOrgMSP.admin', 'InventoryOrgMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('InventoryOrgMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('InventoryOrgMSP.peer')"
    AnchorPeers:
      - Host: peer0.lab.inventory.com
        Port: 7051

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_0: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: etcdraft
  Addresses:
    - orderer.inventory.com:7050
  EtcdRaft:
    Consenters:
      - Host: orderer.inventory.com
        Port: 7050
        ClientTLSCert: crypto-config/ordererOrganizations/inventory.com/orderers/orderer.inventory.com/tls/server.crt
        ServerTLSCert: crypto-config/ordererOrganizations/inventory.com/orderers/orderer.inventory.com/tls/server.crt
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 100
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  InventoryOrdererGenesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
      Capabilities:
        <<: *OrdererCapabilities
    Consortiums:
      InventoryConsortium:
        Organizations:
          - *InventoryOrg

  InventoryOrgChannel:
    <<: *ChannelDefaults
    Consortium: InventoryConsortium
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *InventoryOrg
      Capabilities:
        <<: *ApplicationCapabilities
